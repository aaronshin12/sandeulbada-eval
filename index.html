<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산들바다 발제 평가의견서</title>
<meta name="robots" content="noindex">
<style>
/* ── 디자인 시스템: 미니멀리즘 × Emerald ── */
:root{
  --sys-acc:#10B981; --sys-acc-c:#fff; --sys-tint:rgba(16,185,129,0.16);
  --ms-br-r:2px; --ms-br-sh:0 1px 3px rgba(0,0,0,.06);
  --ms-main-bg:#fff; --ms-t1:#111; --ms-t2:#888; --ms-t3:#BBB;
  --ms-btn-bg:#1A1A1A; --ms-btn-c:#fff;
  --ms-chip-bg:#F4F4F4; --ms-art-r:2px;
  --ms-track-bd:1px solid #EEE;
  --s4:#0E9F6E; --s3:#5BA8A0; --s2:#D99A1E; --s1:#D1483B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F4F4F4;color:var(--ms-t1);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:22px 12px 40px}
.app{display:flex;gap:16px;justify-content:center;align-items:flex-start}
.wrap{display:flex;gap:16px;justify-content:center;align-items:flex-start;max-width:1040px;margin:0 auto;flex:none}
.sheet{zoom:var(--sz,1)}

/* ── 우측 발제자료(PDF) 뷰어 ── */
.viewer{display:none;flex:1 1 0;min-width:0;position:sticky;top:16px;height:calc(100vh - 32px);
  background:#fff;box-shadow:var(--ms-br-sh);border-radius:var(--ms-br-r);flex-direction:column;overflow:hidden}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:var(--ms-track-bd);flex:none}
.viewer .vt{font-size:11px;color:var(--ms-t2);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.viewer .vt b{color:var(--ms-t1);font-size:13px;letter-spacing:0;margin-left:6px}
.viewer .va{font:inherit;font-size:12px;font-weight:600;color:var(--ms-t1);background:var(--ms-chip-bg);border:0;border-radius:var(--ms-br-r);padding:7px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.viewer .va:hover{background:#EAEAEA}
.viewer .vb{flex:1;position:relative;background:#525659;min-height:0}
.viewer .vb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#525659}
.viewer .vb iframe.on{display:block}
.viewer .vb .ld{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#DDD;font-size:12.5px;pointer-events:none}
.viewer .vb.loading .ld{display:flex}
.viewer.collapsed{flex:none;width:44px}
.viewer.collapsed .vh{flex-direction:column;height:100%;justify-content:flex-start;padding:10px 0;border:0;gap:12px}
.viewer.collapsed .vt,.viewer.collapsed #vopen,.viewer.collapsed .vb{display:none}
.viewer.collapsed #vhide{writing-mode:vertical-rl;padding:12px 7px}
@media screen and (min-width:1280px){
  .app.has-viewer{justify-content:flex-start}
  .app.has-viewer .wrap{margin:0}
  .app.has-viewer:has(.viewer.collapsed){justify-content:center}
  .viewer{display:flex}
}

/* ── 좌측 플로팅 메뉴 ── */
.side{position:sticky;top:16px;width:226px;flex:none;background:#fff;box-shadow:var(--ms-br-sh);border-radius:var(--ms-br-r);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px}
.side .ttl{font-size:11px;color:var(--ms-t2);letter-spacing:.08em;padding:0 4px}
.side .ttl b{color:var(--ms-t1);font-size:12px;letter-spacing:0;margin-left:4px}
.list{display:flex;flex-direction:column;gap:3px}
.ci{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid transparent;border-radius:var(--ms-br-r);background:transparent;font:inherit;font-size:13px;font-weight:500;color:#555;cursor:pointer;text-align:left;width:100%;transition:.1s}
.ci .n{width:18px;height:18px;border-radius:50%;border:1px solid #DDD;font-size:10.5px;font-weight:600;color:#999;display:flex;align-items:center;justify-content:center;flex:none}
.ci .c{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci:hover{background:#F7F7F7}
.ci.done .n{background:var(--sys-acc);border-color:var(--sys-acc);color:#fff}
.ci.done .n::before{content:"✓"}
.ci.done .n span{display:none}
.ci.active{background:var(--ms-btn-bg);border-color:var(--ms-btn-bg);color:#fff;font-weight:700}
.ci.active .n{border-color:rgba(255,255,255,.5);color:#fff}
.ci.active.done .n{background:var(--sys-acc);border-color:var(--sys-acc)}
.side .btns{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:var(--ms-track-bd)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:10px 12px;border:0;border-radius:var(--ms-br-r);cursor:pointer;background:var(--ms-chip-bg);color:var(--ms-t1);white-space:nowrap;width:100%}
.btn.pri{background:var(--sys-acc);color:var(--sys-acc-c)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:6px}
.msg{font-size:11.5px;color:var(--ms-t2);line-height:1.45;padding:0 4px;min-height:16px}
.msg.ok{color:var(--sys-acc);font-weight:600}
.msg.err{color:#C0392B;font-weight:600}
.side .hint{font-size:10.5px;color:var(--ms-t3);line-height:1.45;padding:0 4px}

/* ── 용지 ── */
.sheet{width:210mm;height:297mm;flex:none;background:var(--ms-main-bg);box-shadow:var(--ms-br-sh);
  padding:14mm 15mm 12mm;display:none;flex-direction:column;border-radius:var(--ms-br-r)}
.sheet.active{display:flex}

.hd{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:4mm;border-bottom:1.5px solid var(--ms-t1)}
.hd h1{font-size:19pt;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.hd .meta{text-align:right;font-size:8.5pt;color:var(--ms-t2);line-height:1.6}
.hd .meta b{color:var(--ms-t1);font-weight:600}

.info{display:grid;grid-template-columns:1.3fr 1fr 1fr .7fr;border-bottom:var(--ms-track-bd);margin-bottom:4mm}
.info>div{padding:3mm 3mm 2.6mm 0;border-right:var(--ms-track-bd)}
.info>div+div{padding-left:3.5mm}
.info>div:last-child{border-right:0}
.info label{display:block;font-size:7.5pt;color:var(--ms-t2);letter-spacing:.06em;margin-bottom:1.4mm}
.info .v{font-size:11pt;font-weight:600;padding-bottom:1mm;min-height:6.5mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .v .no{display:inline-block;min-width:5.5mm;height:5.5mm;line-height:5.5mm;text-align:center;border-radius:1mm;background:var(--ms-btn-bg);color:#fff;font-size:8pt;margin-right:1.8mm;vertical-align:1px}
.info input{width:100%;border:0;border-bottom:1px solid #DDD;background:transparent;font:inherit;font-size:11pt;font-weight:600;color:var(--ms-t1);padding:0 0 1mm;outline:0;border-radius:0;min-height:6.5mm}
.info input:focus{border-bottom-color:var(--sys-acc)}
.info input::placeholder{color:var(--ms-t3);font-weight:400}

.body{flex:1;display:flex;flex-direction:column;min-height:0}
.sec{flex:1 1 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sec+.sec{padding-top:3.5mm}
.sec-hd{display:flex;align-items:center;gap:2.5mm;margin-bottom:2.4mm;padding:1.6mm 3mm;border-radius:var(--ms-br-r);color:#fff}
.sec-hd .n{font-size:8pt;font-weight:700;letter-spacing:.1em;opacity:.8}
.sec-hd h2{font-size:11pt;font-weight:700}
.sec-hd .s{font-size:7.5pt;margin-left:auto;opacity:.85}
.sec.quant .sec-hd{background:var(--sys-acc)}
.sec.qual .sec-hd{background:var(--ms-btn-bg)}

/* 정량 표 */
table{width:100%;border-collapse:collapse;flex:1;table-layout:fixed}
col.cq{width:auto}col.co{width:21mm}
thead th{font-size:7.5pt;font-weight:600;padding:0 0 1.6mm;border-bottom:1px solid #DDD;text-align:center;letter-spacing:.02em}
thead th:first-child{text-align:left;color:var(--ms-t2);font-weight:500}
thead th.h4{color:var(--s4)}thead th.h3{color:var(--s3)}thead th.h2{color:var(--s2)}thead th.h1{color:var(--s1)}
tbody td{border-bottom:var(--ms-track-bd);vertical-align:middle;padding:1.2mm 0}
tbody tr:last-child td{border-bottom:0}
td.q{padding-right:3mm}
td.q .t{font-size:10pt;font-weight:600;line-height:1.25}
.no{display:inline-block;width:4.5mm;color:var(--ms-t3);font-weight:500;font-size:8.5pt}
td.o{text-align:center;padding-left:1mm;padding-right:1mm}
.opt{display:flex;align-items:center;justify-content:center;height:7.6mm;border:1px solid #D8D8D8;border-radius:999px;cursor:pointer;position:relative;
  font-size:7.8pt;font-weight:600;color:#9A9A9A;background:#fff;transition:.12s;user-select:none}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt:hover{border-color:#999;color:#555}
.opt.v4:has(input:checked){background:var(--s4);border-color:var(--s4);color:#fff}
.opt.v3:has(input:checked){background:var(--s3);border-color:var(--s3);color:#fff}
.opt.v2:has(input:checked){background:var(--s2);border-color:var(--s2);color:#fff}
.opt.v1:has(input:checked){background:var(--s1);border-color:var(--s1);color:#fff}
tr.miss td.q .t{color:#C0392B}

/* 정성 */
.qa{flex:1;display:flex;flex-direction:column;gap:2.4mm;min-height:0}
.qa .item{flex:1 1 0;display:flex;flex-direction:column;min-height:0}
.qa .lbl{font-size:10pt;font-weight:600;margin-bottom:1.2mm}
.qa .lbl .d{font-size:7.6pt;color:var(--ms-t2);font-weight:400;margin-left:1.5mm}
.qa .box{flex:1;border:1px solid #DDD;border-radius:var(--ms-art-r);padding:2mm 2.4mm;font-size:9.3pt;line-height:1.5;outline:0;overflow-y:auto;background:#FFF;min-height:0}
.qa .box:focus{border-color:var(--sys-acc)}
.qa .box:empty:before{content:attr(data-ph);color:var(--ms-t3)}

.ft{padding-top:3mm;margin-top:3mm;border-top:var(--ms-track-bd);font-size:7.3pt;color:var(--ms-t3);display:flex;justify-content:space-between}

@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;padding:0}
  .app,.wrap{display:block;max-width:none}
  .side,.viewer{display:none!important}
  .sheet{zoom:1}
  .sheet{display:flex;box-shadow:none;border-radius:0;width:210mm;height:296.5mm;overflow:hidden;page-break-after:always}
  .sheet:last-of-type{page-break-after:auto}
  .info input{border-bottom-color:#DDD}
  .opt{border-color:#BBB;color:#777}
  .opt:has(input:checked){background:#111!important;border-color:#111!important;color:#fff!important}
  .qa .box{border-color:#CCC;overflow:hidden}
  .qa .box:empty:before{content:""}
}
@media screen and (max-width:1020px){
  body{padding:10px 6px 40px}
  .app{display:block}
  .wrap{flex-direction:column;align-items:center}
  .side{position:static;width:100%;max-width:210mm}
  .list{flex-direction:row;flex-wrap:wrap}.ci{width:auto;flex:1 1 23%}
  .side .btns{flex-direction:row;flex-wrap:wrap}.btn{width:auto;flex:1}
  .sheet{width:100%;max-width:210mm;height:auto;min-height:297mm;padding:9mm 7mm}
  .info{grid-template-columns:1fr 1fr}
  .info>div:nth-child(2){border-right:0}
  .info>div:nth-child(3){padding-left:0;border-top:var(--ms-track-bd)}
  .info>div:nth-child(4){border-top:var(--ms-track-bd)}
  col.co{width:17mm}.opt{font-size:7pt}
  .qa .box{min-height:28mm;max-height:60mm}
}
</style>
</head>
<body>
<div class="app has-viewer" id="app">
<div class="wrap">

<aside class="side">
  <div class="ttl">발제기업 <b id="cnt">0/8</b></div>
  <div class="list" id="list"></div>
  <div class="btns">
    <div class="nav"><button class="btn" id="prev">← 이전</button><button class="btn" id="next">다음 →</button></div>
    <button class="btn" id="print">PDF 저장 / 인쇄</button>
    <button class="btn pri" id="submit">전체 접수</button>
    <div class="msg" id="msg"></div>
    <div class="hint">8개사를 모두 작성한 뒤 [전체 접수]를 한 번만 누르세요. 작성 중 내용은 이 브라우저에 자동 저장되며, 접수 후 수정하고 다시 접수하면 갱신됩니다.</div>
  </div>
</aside>

<div id="sheets" style="display:contents"></div>

</div>

<aside class="viewer" id="viewer" aria-label="발제자료">
  <div class="vh">
    <span class="vt">발제자료 <b id="vco"></b></span>
    <a class="va" id="vopen" href="#" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    <button class="va" id="vhide" type="button">자료 숨기기</button>
  </div>
  <div class="vb" id="vb"><div class="ld">발제자료를 불러오는 중…</div></div>
</aside>

</div>

<script>

const COMPANIES = ["로웨인","로지스틱스테크스탠다드","한나바이오","스푼타임","메이투투","플랜트너","에딧미","보나플로"];
// 발제자료 PDF — Google Drive 파일 ID (COMPANIES와 같은 순서). 파일을 삭제 후 재업로드하면 ID가 바뀌므로 "새 버전 업로드"로 교체할 것.
const PDF_IDS = ["1BjypjenlrgitMrBAAMh4S80GacydxczQ","15co-JEWVD46QAsPyXz_-C0QT2QTOzauO","1FRJnuSP70XIR3nGbk-m9A4qAmJqPY5Rx","1rl3lcV5bWFyGtvRQSBeoDZlCfIFcIiCh","15Mu7EUDR3llJVIXQf_cRS_fcU80xQn50","1aT1-McoA02Try08s55TfJriUtVmSuNwP","12hhxD_akRf5u2LnYqXhm26NUCQrVyTat","1Wcr6Z2IFviCgVAf4tTti6yvslZRWsGIu"];
const pdfPreview = k=>`https://drive.google.com/file/d/${PDF_IDS[k-1]}/preview`;
const pdfView = k=>`https://drive.google.com/file/d/${PDF_IDS[k-1]}/view`;
const Q = ["협업과제의 명확성","식품 밸류체인 연계성","기술·제품의 차별성","협업 실현 가능성","수요기업 관점의 매력도","사업성·확장성","발표 전달력"];
const SCALE = [[4,"매우 좋음"],[3,"좋음"],[2,"보완 필요"],[1,"보완 시급"]];
const C = [
  ["협업 가능성이 높아 보이는 포인트","강점","예) 수요기업의 어떤 니즈와 맞닿아 있는지, 바로 시도해볼 만한 협업 형태"],
  ["보완·검증이 필요한 사항","","예) 과제 범위, 기술·품질 검증, 규제·인증, 단가·물량 등"],
  ["추천 협업 파트너 또는 다음 단계 제언","","예) 연결하면 좋을 기업·기관, 다음 단계로 권하는 액션"],
];
const $ = id=>document.getElementById(id);

$("sheets").innerHTML = COMPANIES.map((co,ci)=>{ const k=ci+1; return `
<div class="sheet" id="s${k}" data-k="${k}">
  <div class="hd">
    <h1>발제 평가의견서</h1>
    <div class="meta">산들바다 <b>푸드 스타트업 오픈이노베이션</b><br>2026. 10. 14 (수) · 코엑스마곡 컨벤션센터 501호</div>
  </div>
  <div class="info">
    <div><label>발제기업</label><div class="v"><span class="no">${k}</span>${co}</div></div>
    <div><label>심사위원 성명</label><input class="jn" type="text" placeholder="성명" autocomplete="off"></div>
    <div><label>소속 · 직위</label><input class="jo" type="text" placeholder="기관 · 직위" autocomplete="off"></div>
    <div><label>평가일자</label><div class="v">2026. 10. 14</div></div>
  </div>
  <div class="body">
    <section class="sec quant">
      <div class="sec-hd"><span class="n">01</span><h2>정량평가</h2><span class="s">항목별 1개 선택 · 순위 산정 없음</span></div>
      <table>
        <colgroup><col class="cq"><col class="co"><col class="co"><col class="co"><col class="co"></colgroup>
        <thead><tr><th>평가 항목</th>${SCALE.map(([v,l])=>`<th class="h${v}">${l}</th>`).join("")}</tr></thead>
        <tbody>${Q.map((q,i)=>`<tr id="r${k}_${i+1}">
          <td class="q"><div class="t"><span class="no">${i+1}</span>${q}</div></td>
          ${SCALE.map(([v,l])=>`<td class="o"><label class="opt v${v}"><input type="radio" name="q${k}_${i+1}" value="${v}">${l}</label></td>`).join("")}
        </tr>`).join("")}</tbody>
      </table>
    </section>
    <section class="sec qual">
      <div class="sec-hd"><span class="n">02</span><h2>정성평가</h2><span class="s">자유 서술</span></div>
      <div class="qa">${C.map((c,i)=>`<div class="item">
        <div class="lbl"><span class="no">${i+1}</span>${c[0]}${c[1]?`<span class="d">${c[1]}</span>`:""}</div>
        <div class="box" id="c${k}_${i+1}" contenteditable="true" data-ph="${c[2]}"></div>
      </div>`).join("")}</div>
    </section>
  </div>
  <div class="ft"><span>본 의견서는 발제기업 피드백 및 밋업 연계 참고 자료로만 활용되며, 순위·시상에 사용되지 않습니다.</span><span>${k} / 8</span></div>
</div>`;}).join("");

$("list").innerHTML = COMPANIES.map((co,i)=>`<button class="ci" data-k="${i+1}"><span class="n"><span>${i+1}</span></span><span class="c">${co}</span></button>`).join("");

// ── 상태 ──
let cur = 1;
const STORE = "sb_eval_v3";
function readState(){
  const st = { jname:document.querySelector("#s1 .jn").value.trim(), jorg:document.querySelector("#s1 .jo").value.trim(), sheets:{} };
  for(let k=1;k<=8;k++){ const s={q:{},c:{}};
    for(let i=1;i<=7;i++){ const r=document.querySelector(`input[name="q${k}_${i}"]:checked`); if(r) s.q[i]=+r.value; }
    for(let i=1;i<=3;i++){ s.c[i]=$(`c${k}_${i}`).innerText.trim(); }
    st.sheets[k]=s; }
  return st;
}
function applyState(st){
  if(!st) return;
  document.querySelectorAll(".jn").forEach(e=>e.value=st.jname||""); document.querySelectorAll(".jo").forEach(e=>e.value=st.jorg||"");
  for(let k=1;k<=8;k++){ const s=st.sheets&&st.sheets[k]; if(!s) continue;
    for(let i=1;i<=7;i++){ if(s.q[i]){ const r=document.querySelector(`input[name="q${k}_${i}"][value="${s.q[i]}"]`); if(r) r.checked=true; } }
    for(let i=1;i<=3;i++){ if(s.c[i]) $(`c${k}_${i}`).innerText=s.c[i]; } }
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(readState())); }catch(e){} }
try{ applyState(JSON.parse(localStorage.getItem(STORE)||"null")); }catch(e){}

const complete = (st,k)=>Object.keys(st.sheets[k].q).length===7;
function refresh(){
  const st=readState(); let n=0;
  document.querySelectorAll(".ci").forEach(t=>{ const k=+t.dataset.k; const d=complete(st,k); if(d) n++; t.classList.toggle("done",d); t.classList.toggle("active",k===cur); });
  document.querySelectorAll(".sheet").forEach(s=>s.classList.toggle("active",+s.dataset.k===cur));
  $("cnt").textContent=`${n}/8`;
  $("prev").disabled=cur===1; $("next").disabled=cur===8;
  showPdf(cur);
}

// ── 발제자료 뷰어: 처음 열 때만 iframe 생성, 이후 재방문은 즉시 표시 ──
const VSTORE = "sb_eval_viewer";
function showPdf(k){
  $("vco").textContent=`${k}. ${COMPANIES[k-1]}`;
  $("vopen").href=pdfView(k);
  if($("viewer").classList.contains("collapsed")) return;
  const vb=$("vb"); let f=vb.querySelector(`iframe[data-k="${k}"]`);
  vb.querySelectorAll("iframe.on").forEach(i=>i.classList.remove("on"));
  if(!f){
    f=document.createElement("iframe"); f.dataset.k=k; f.title=`${COMPANIES[k-1]} 발제자료`; f.allow="autoplay";
    vb.classList.add("loading");
    f.addEventListener("load",()=>{ if(f.classList.contains("on")) vb.classList.remove("loading"); });
    f.src=pdfPreview(k); vb.appendChild(f);
  }else vb.classList.remove("loading");
  f.classList.add("on");
}
function setCollapsed(c){
  $("viewer").classList.toggle("collapsed",c);
  $("vhide").textContent=c?"자료 보기":"자료 숨기기";
  try{ localStorage.setItem(VSTORE,c?"1":"0"); }catch(e){}
  fit(); if(!c) showPdf(cur);
}
$("vhide").addEventListener("click",()=>setCollapsed(!$("viewer").classList.contains("collapsed")));
try{ if(localStorage.getItem(VSTORE)==="1") setCollapsed(true); }catch(e){}

// ── 화면이 좁으면 용지를 축소해 뷰어 폭을 확보 (뷰어 최소 560px, 용지 최소 70%) ──
const SIDE_W=226, GAP=16, SHEET_W=794, MIN_VIEWER=560, MIN_ZOOM=.7;
function fit(){
  const v=$("viewer"); const shown=getComputedStyle(v).display!=="none" && !v.classList.contains("collapsed");
  let z=1;
  if(shown){ const avail=document.documentElement.clientWidth-24-GAP;
    if(avail-SIDE_W-GAP-SHEET_W<MIN_VIEWER) z=Math.max(MIN_ZOOM,(avail-MIN_VIEWER-SIDE_W-GAP)/SHEET_W); }
  document.documentElement.style.setProperty("--sz",z.toFixed(3));
}
window.addEventListener("resize",fit); fit();
function go(k){ cur=Math.min(8,Math.max(1,k)); refresh(); window.scrollTo({top:0,behavior:"smooth"}); }
$("list").addEventListener("click",e=>{ const t=e.target.closest(".ci"); if(t) go(+t.dataset.k); });
$("prev").addEventListener("click",()=>go(cur-1));
$("next").addEventListener("click",()=>go(cur+1));
document.querySelectorAll(".jn,.jo").forEach(e=>e.addEventListener("input",()=>{ const cls=e.classList.contains("jn")?".jn":".jo"; document.querySelectorAll(cls).forEach(o=>{ if(o!==e) o.value=e.value; }); }));
$("sheets").addEventListener("input",()=>{ save(); refresh(); unlock(); });
$("sheets").addEventListener("change",()=>{ save(); refresh(); unlock(); });

const msg=(t,c="")=>{ $("msg").textContent=t; $("msg").className="msg "+c; };
let submitted=false;
function unlock(){ if(submitted){ submitted=false; $("submit").disabled=false; msg("내용이 수정되었습니다 — 다시 [전체 접수]하면 갱신됩니다."); } }

$("submit").addEventListener("click", async ()=>{
  const st=readState(); const errs=[];
  document.querySelectorAll("tr.miss").forEach(r=>r.classList.remove("miss"));
  if(!st.jname) errs.push("심사위원 성명 미입력");
  const inc=[];
  for(let k=1;k<=8;k++){ if(!complete(st,k)){ inc.push(k); for(let i=1;i<=7;i++) if(!st.sheets[k].q[i]) $(`r${k}_${i}`).classList.add("miss"); } }
  if(inc.length) errs.push("미완료: "+inc.map(k=>`${k}.${COMPANIES[k-1]}`).join(", "));
  if(errs.length){ msg("접수 불가 — "+errs.join(" / "),"err"); if(inc.length) go(inc[0]); return; }
  const rows=[]; for(let k=1;k<=8;k++){ const s=st.sheets[k];
    rows.push({ company_no:k, company_name:COMPANIES[k-1], judge_name:st.jname, judge_org:st.jorg||null,
      q1:s.q[1],q2:s.q[2],q3:s.q[3],q4:s.q[4],q5:s.q[5],q6:s.q[6],q7:s.q[7], c1:s.c[1]||null,c2:s.c[2]||null,c3:s.c[3]||null }); }
  $("submit").disabled=true; msg("접수 중…");
  try{
    const r=await fetch(SB_URL+"/rest/v1/evaluations",{ method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Prefer":"return=minimal"},
      body:JSON.stringify(rows) });
    if(!r.ok){ const t=await r.text(); throw new Error(r.status+" "+t.slice(0,160)); }
    submitted=true; msg(`접수 완료 · ${st.jname} 심사위원, 8개사 평가의견서가 제출되었습니다. 감사합니다.`,"ok");
  }catch(e){ msg("접수 실패 — 다시 시도해 주세요 ("+e.message+")","err"); $("submit").disabled=false; }
});
$("print").addEventListener("click",()=>window.print());
refresh();
</script>
</body>
